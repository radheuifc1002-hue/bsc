name: PULSE system contracts

on:
  push:
    branches: ["pulse-chain/phase-0-foundation"]
    paths:
      - "pulse-contracts/**"
      - ".github/workflows/pulse-contracts.yml"
  pull_request:
    paths:
      - "pulse-contracts/**"
      - ".github/workflows/pulse-contracts.yml"

permissions:
  contents: write

jobs:
  foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pulse-contracts/package-lock.json
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install pinned Solidity dependencies
        working-directory: pulse-contracts
        run: npm ci
      - name: Build system contracts
        working-directory: pulse-contracts
        run: forge build
      - name: Run StakeHub initialization tests
        working-directory: pulse-contracts
        run: forge test -vvv
      - name: Export StakeHub runtime bytecode
        working-directory: pulse-contracts
        run: forge inspect StakeHub deployedBytecode > out/StakeHub.deployed-bytecode.txt
      - name: Commit generated PULSE StakeHub runtime
        working-directory: pulse-contracts
        run: |
          mkdir -p ../core/systemcontracts/pulse
          cp out/StakeHub.deployed-bytecode.txt ../core/systemcontracts/pulse/StakeHubContract
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/systemcontracts/pulse/StakeHubContract
          if ! git diff --cached --quiet; then
            git commit -m "build(pulse): update compiled StakeHub runtime"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload compiled contract artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulse-stakehub-solc-0.8.17
          path: |
            pulse-contracts/out/StakeHub.sol/StakeHub.json
            pulse-contracts/out/StakeHub.deployed-bytecode.txt
          if-no-files-found: error
