[profile.default]
src = 'contracts'
test = 'test'
out = 'out'
libs = ['lib', 'node_modules']
auto_detect_solc = false
solc_version = '0.8.17'
optimizer = true
optimizer_runs = 200
bytecode_hash = 'none'

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = 'long'
quote_style = 'double'
